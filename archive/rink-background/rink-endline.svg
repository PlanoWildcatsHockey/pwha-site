<svg viewBox="0 0 1440 640" xmlns="http://www.w3.org/2000/svg">
  <!-- Defensive-zone faceoff circles with hash marks -->
  <g fill="none" stroke="var(--color-primary)" stroke-opacity="0.5" stroke-width="4">
    <circle cx="300" cy="340" r="140" />
    <circle cx="1140" cy="340" r="140" />
  </g>
  <g fill="var(--color-primary)" fill-opacity="0.6">
    <circle cx="300" cy="340" r="14" />
    <circle cx="1140" cy="340" r="14" />
  </g>
  <g stroke="var(--color-primary)" stroke-opacity="0.6" stroke-width="5" stroke-linecap="square">
    <!-- left circle hash marks -->
    <line x1="164" y1="305" x2="140" y2="305" />
    <line x1="164" y1="375" x2="140" y2="375" />
    <line x1="436" y1="305" x2="460" y2="305" />
    <line x1="436" y1="375" x2="460" y2="375" />
    <!-- right circle hash marks -->
    <line x1="1004" y1="305" x2="980" y2="305" />
    <line x1="1004" y1="375" x2="980" y2="375" />
    <line x1="1276" y1="305" x2="1300" y2="305" />
    <line x1="1276" y1="375" x2="1300" y2="375" />
  </g>

  <!-- Goal crease -->
  <path
    d="M605,600 A115,115 0 0 1 835,600 Z"
    fill="var(--color-primary)"
    fill-opacity="0.1"
    stroke="var(--color-primary)"
    stroke-opacity="0.55"
    stroke-width="4"
  />

  <!-- End line -->
  <line x1="0" y1="600" x2="1440" y2="600" stroke="var(--color-primary)" stroke-opacity="0.8" stroke-width="6" />
</svg>
